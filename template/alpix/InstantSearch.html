<div class="instant-search-wrap">
  <!-- Hidden SearchEngine: handles API calls without rendering UI -->
  <div aria-hidden="true" style="display:none;">
    <SearchEngine
      v-bind="{ ...searchEngineProps, pageSize, autoFixScore }"
      :term.sync="searchTerm"
      :is-filterable="false"
      :product-card-props="productCardProps"
      @fetch="handleFetching"
      @search="handleSearch"
    />
  </div>

  <!-- Inline dropdown -->
  <transition enter-active-class="animated fadeIn faster">
    <div
      v-if="isOpen"
      class="instant-search-dropdown"
      role="listbox"
      aria-label="Sugestões de busca"
    >

      <!-- Recent searches (shown when input is empty) -->
      <div v-if="!localTerm && history.length" class="instant-search-dropdown__section">
        <span class="instant-search-dropdown__label">Buscas recentes</span>
        <a
          v-for="term in history"
          :key="term"
          href="#"
          class="instant-search-dropdown__item"
          @click.prevent="setSearchTerm(term)"
        >
          <svg class="instant-search-dropdown__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16" d="M128 48a80 80 0 1 1-80 80V56"/><polyline fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16" points="72 56 48 56 48 80"/><line fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16" x1="128" y1="96" x2="128" y2="136"/><line fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16" x1="108" y1="136" x2="148" y2="136"/></svg>
          <span v-text="term"></span>
        </a>
      </div>

      <!-- Loading indicator -->
      <div v-else-if="!searchResults.length" class="instant-search-dropdown__loading">
        <div class="spinner-border spinner-border-sm" role="status">
          <span class="sr-only">Buscando...</span>
        </div>
        <span>Buscando...</span>
      </div>

      <!-- Search results -->
      <div v-else-if="searchResults.length" class="instant-search-dropdown__section">
        <a
          v-for="item in searchResults"
          :key="item.slug"
          :href="'/' + item.slug"
          class="instant-search-dropdown__item"
        >
          <svg class="instant-search-dropdown__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" aria-hidden="true"><circle cx="112" cy="112" r="80" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><line x1="168.57" y1="168.57" x2="224" y2="224" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/></svg>
          <span v-text="item.name"></span>
        </a>
        <a
          :href="searchAllHref"
          class="instant-search-dropdown__see-all"
        >
          Ver todos os resultados para
          <strong v-text="localTerm"></strong>
        </a>
      </div>

    </div>
  </transition>
</div>
